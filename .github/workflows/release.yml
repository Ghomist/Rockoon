name: "Publish"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  # Windows 版：真正发 release 的 job（建 tag / 写正文 / 上传 latest.json）。
  # macOS 版排在它后面，等这个 job 把 release 建出来再把 dmg 补进去。
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # GitHub 的 windows runner 预装了 cmake（原本用 actions-setup-cmake 要花 26 秒下载）

      - name: Cache BMLPlus SDK and bmodp build
        uses: actions/cache@v4
        with:
          path: |
            src-bmodp/3rd-party/BMLPlus
            src-bmodp/build
          # SDK 版本写在 config.ps1，源码变了用 restore-keys 回退到上次的构建做增量编译
          key: bmodp-${{ runner.os }}-${{ hashFiles('src-bmodp/config.ps1', 'src-bmodp/CMakeLists.txt', 'src-bmodp/src/**') }}
          restore-keys: |
            bmodp-${{ runner.os }}-

      # 逐 crate 缓存编译产物：rust-cache 缓存的是（被裁剪过的）target 目录，
      # 依赖产物复用不完整；sccache 是内容寻址的编译缓存，两者互补
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # 构建失败也保存缓存：重跑时已编译的依赖能直接复用
          cache-on-failure: true

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install

      # 发版约束：每次发新 release 前必须先写 release-notes/<版本>.md（新增/修改/删除，
      # 格式见该目录 README）。这份文件同时是 GitHub release 正文和 latest.json 的
      # `notes` —— 也就是启动器「发现新版本」弹窗里显示的更新内容，所以没写就不让发。
      - name: 读更新日志
        id: notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          FILE="release-notes/$VERSION.md"
          if [ ! -s "$FILE" ]; then
            echo "::error::缺少 $FILE —— 每次发版都要先写更新日志（模板见 release-notes/_TEMPLATE.md）"
            exit 1
          fi
          echo "读到 $FILE："
          cat "$FILE"
          {
            echo "body<<__ROCKOON_NOTES_EOF__"
            cat "$FILE"
            echo "__ROCKOON_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }} # ref to private key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }} # ref to key password
          # sccache 走 GitHub Actions 缓存后端；incremental 与 sccache 冲突，关掉
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
        with:
          tagName: rockoon-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Rockoon v__VERSION__"
          # 正文 = release-notes/<版本>.md，tauri-action 会把它写进 latest.json 的 notes
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # 发布完成后通知下载站去 GitHub 拉一次最新 release。
      # 下载站（dl.ballance.top）既是主下载入口，也是 rockoon 的更新源镜像；
      # 接口公开且幂等，force=true 跳过服务端 TTL 立即同步；同步失败不影响发布结果。
      - name: Sync download site
        continue-on-error: true
        # 必须显式指定 bash：这个 job 跑在 Windows runner 上，run 的默认外壳是
        # PowerShell，bash 语法（$(seq ...) / grep -q / 反引号续行）会直接语法错、
        # 0 秒退出，而 continue-on-error 会把它伪装成 success —— 于是同步从来没发生过。
        shell: bash
        run: |
          # tauri-action 是先创建 release、再上传 asset；这期间 release 还是 draft，
          # 公开 API 看不到，钩子这时同步到的会是上一个版本 —— 但它照样返回 200。
          # 所以要按「下载站报出来的版本」轮询确认，而不是看这一次 POST 是否成功。
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for i in $(seq 1 10); do
            BODY=$(curl -fsS -X POST "https://dl.ballance.top/rockoon/sync?force=true" \
              -H "User-Agent: rockoon-release-hook" \
              --retry 3 --retry-delay 10 --max-time 60 || echo "")
            echo "第 $i 次同步响应：$BODY"
            if echo "$BODY" | grep -q "\"version\":\"$VERSION\""; then
              echo "下载站已同步到 $VERSION"
              exit 0
            fi
            sleep 30
          done
          echo "重试 10 次仍未同步到 $VERSION（GitHub release 可能还没公开）" >&2
          exit 1

  # macOS 版：Windows 那份 release 建好之后，把 dmg 和自更新包补进同一个 release。
  # 不走 tauri-action —— 它会在每个 job 各生成一份 latest.json 互相覆盖；
  # macOS 的更新包由本 job 手动签名上传，darwin 条目由本 job 合并进那份 latest.json。
  #
  # 必须在 publish-windows 之后跑（needs）：fetch-bmodp 要从**同版本**的 Windows
  # 安装包里抠 RockoonIO.bmodp，release 不存在时它会退回上一次的 latest 版本。
  publish-macos:
    needs: publish-windows
    permissions:
      contents: write
    runs-on: macos-latest # Apple 芯片
    steps:
      # C++ 模组在 macOS 上编不了（32 位 MSVC），构建时从 Windows 安装包里取（scripts/fetch-bmodp.mjs），
      # 所以不需要子模块
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      # 一个包同时支持 Apple 芯片与 Intel（下载站只放一个 macOS 版）
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      # fetch-bmodp 要用 7-Zip 解 NSIS 安装包
      - name: install 7-Zip
        run: brew install sevenzip

      # Wine 原包约 190 MB，版本钉在 scripts/fetch-wine.mjs 里，脚本不变就不用再下
      - name: Cache Wine tarball
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/rockoon-wine
          key: wine-${{ runner.os }}-${{ hashFiles('scripts/fetch-wine.mjs') }}

      - name: install frontend dependencies
        run: pnpm install

      # CI=true（Actions 默认就有）让 tauri 跳过 Finder 摆 DMG 窗口那一步。
      # 构建前会跑 fetch:bmodp 与 fetch:wine（tauri.macos.conf.json）：
      # 前者从本版本的 Windows 安装包里取 RockoonIO.bmodp，后者把 Wine 打进包里。
      - name: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # macOS 的更新包（.app.tar.gz）也要签名：客户端的校验公钥就是 tauri.conf.json 里那个
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin

      # 手动跑 workflow 时也能直接从 Artifacts 拿 dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rockoon-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

      # 1) 先传更新包（.app.tar.gz + .sig）+ dmg，2) 再把 darwin 条目合并进 latest.json。
      # 顺序不能反：清单先于资产出现的话，客户端会去下一个不存在的包。
      - name: 上传 dmg / 更新包到 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          TARBALL=$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          echo "上传 $DMG 与 $TARBALL 到 rockoon-v$VERSION"
          gh release upload "rockoon-v$VERSION" "$DMG" "$TARBALL" "$TARBALL.sig" --clobber

      # latest.json 是 Windows job 生成的（tauri-action 只会写当前平台）。
      # macOS 自更新要在这里把 darwin 条目加进去：通用包在 Apple 芯片上跑就查 darwin-aarch64，
      # 在 Intel 上跑就查 darwin-x86_64 —— 两个键指向同一个通用包。
      # （不能改成让 tauri-action 在 mac 上再生成一份 latest.json：两份会互相覆盖，
      #   而且 mac 的 bundle 类型没有 windows-*_nsis 之类的键，只能补不能替。）
      - name: 合并 darwin 条目进 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TARBALL=$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          gh release download "rockoon-v$VERSION" --pattern latest.json --dir "$RUNNER_TEMP" --clobber
          node -e '
            const fs = require("fs");
            const [, , file, sig, url] = process.argv;
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            const entry = { signature: sig, url };
            json.platforms = json.platforms || {};
            json.platforms["darwin-aarch64"] = entry;
            json.platforms["darwin-x86_64"] = entry;
            // notes / pub_date 保持 Windows job 写的那份不动
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            console.log("platforms:", Object.keys(json.platforms).join(", "));
          ' "$RUNNER_TEMP/latest.json" "$(cat "$TARBALL.sig")" \
            "https://github.com/${{ github.repository }}/releases/download/rockoon-v$VERSION/$(basename "$TARBALL")"
          gh release upload "rockoon-v$VERSION" "$RUNNER_TEMP/latest.json" --clobber
          gh release view "rockoon-v$VERSION" --json assets --jq '.assets[].name'

      # Windows job 那次同步只看到安装包；dmg 是后补的，再拉一次让下载站和 GitHub 对齐
      - name: Sync download site
        continue-on-error: true
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for i in $(seq 1 5); do
            BODY=$(curl -fsS -X POST "https://dl.ballance.top/rockoon/sync?force=true" \
              -H "User-Agent: rockoon-release-hook" \
              --retry 3 --retry-delay 10 --max-time 60 || echo "")
            echo "第 $i 次同步响应：$BODY"
            if echo "$BODY" | grep -q "\"version\":\"$VERSION\""; then
              echo "下载站已同步到 $VERSION"
              exit 0
            fi
            sleep 20
          done
          echo "重试 5 次仍未同步到 $VERSION（不影响发布）" >&2
          exit 1
