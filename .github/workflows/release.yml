name: "Publish (Windows only)"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          ## Currently supported Windows only
          #   - platform: "macos-latest" # for Arm based macs (M1 and above).
          #     args: "--target aarch64-apple-darwin"
          #   - platform: "macos-latest" # for Intel based macs.
          #     args: "--target x86_64-apple-darwin"
          #   - platform: "ubuntu-22.04"
          #     args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # GitHub 的 windows/ubuntu/macos runner 都预装了 cmake（原本用 actions-setup-cmake 要花 26 秒下载）

      - name: Cache BMLPlus SDK and bmodp build
        uses: actions/cache@v4
        with:
          path: |
            src-bmodp/3rd-party/BMLPlus
            src-bmodp/build
          # SDK 版本写在 config.ps1，源码变了用 restore-keys 回退到上次的构建做增量编译
          key: bmodp-${{ runner.os }}-${{ hashFiles('src-bmodp/config.ps1', 'src-bmodp/CMakeLists.txt', 'src-bmodp/src/**') }}
          restore-keys: |
            bmodp-${{ runner.os }}-

      # 逐 crate 缓存编译产物：rust-cache 缓存的是（被裁剪过的）target 目录，
      # 依赖产物复用不完整；sccache 是内容寻址的编译缓存，两者互补
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # 构建失败也保存缓存：重跑时已编译的依赖能直接复用
          cache-on-failure: true

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }} # ref to private key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }} # ref to key password
          # sccache 走 GitHub Actions 缓存后端；incremental 与 sccache 冲突，关掉
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
        with:
          tagName: rockoon-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Rockoon v__VERSION__"
          # releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 发布完成后通知下载站去 GitHub 拉一次最新 release。
      # 下载站（dl.ballance.top）既是主下载入口，也是 rockoon 的更新源镜像；
      # 接口公开且幂等，force=true 跳过服务端 TTL 立即同步；同步失败不影响发布结果。
      - name: Sync download site
        continue-on-error: true
        run: |
          # tauri-action 是先创建 release、再上传 asset；这期间 release 还是 draft，
          # 公开 API 看不到，钩子这时同步到的会是上一个版本 —— 但它照样返回 200。
          # 所以要按「下载站报出来的版本」轮询确认，而不是看这一次 POST 是否成功。
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for i in $(seq 1 10); do
            BODY=$(curl -fsS -X POST "https://dl.ballance.top/rockoon/sync?force=true" \
              -H "User-Agent: rockoon-release-hook" \
              --retry 3 --retry-delay 10 --max-time 60 || echo "")
            echo "第 $i 次同步响应：$BODY"
            if echo "$BODY" | grep -q "\"version\":\"$VERSION\""; then
              echo "下载站已同步到 $VERSION"
              exit 0
            fi
            sleep 30
          done
          echo "重试 10 次仍未同步到 $VERSION（GitHub release 可能还没公开）" >&2
          exit 1
